<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Refiner</title>
  <style>
    :root {
      --bg:        #141414;
      --surface:   #1e1e1e;
      --surface2:  #252526;
      --border:    #2e2e2e;
      --border-hi: #3a3a3a;
      --accent:    #4fc3f7;
      --accent-dim:#1a3040;
      --text:      #d4d4d4;
      --text-dim:  #888;
      --text-mute: #555;
      --green:     #4caf50;
      --orange:    #ff9800;
      --red:       #f44336;
      --green-dim: #1b2e1c;
      --orange-dim:#2e2010;
      --red-dim:   #2e1212;
      --radius:    8px;
      --radius-sm: 5px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      font-size: 13px;
    }

    /* ── Layout */
    .app {
      max-width: 780px;
      margin: 0 auto;
      padding: 24px 28px 60px;
    }

    /* ── Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 18px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 8px;
      height: 28px;
      background: linear-gradient(180deg, var(--accent), #0288d1);
      border-radius: 4px;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 0.9em;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .header-meta {
      font-size: 0.75em;
      color: var(--text-mute);
    }

    /* ── Refine Again bar */
    .refine-bar {
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .refine-bar.visible { display: flex; }

    .refine-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border-hi);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.88em;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 0.15s;
    }
    .refine-input:focus { border-color: var(--accent); }
    .refine-input::placeholder { color: var(--text-mute); }

    .btn-refine {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.82em;
      font-weight: 600;
      font-family: var(--font);
      background: var(--accent);
      color: #000;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn-refine:hover { background: #81d4fa; }
    .btn-refine:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Loading */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 80px 0;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border-hi);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      color: var(--text-dim);
      font-size: 0.9em;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

    /* ── Result */
    #result {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* ── Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 14px;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }

    .card-label {
      font-size: 0.7em;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-mute);
      font-weight: 600;
    }

    .card-tag {
      font-size: 0.68em;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
    }

    .tag-original { background: #2a2a2a; color: var(--text-dim); border: 1px solid var(--border-hi); }
    .tag-improved { background: var(--accent-dim); color: var(--accent); border: 1px solid #1e4a60; }

    .card-body {
      padding: 14px;
      font-size: 0.9em;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
    }

    .card-body.mono {
      font-family: var(--mono);
      font-size: 0.85em;
      color: #ce9178;
    }

    .card.improved { border-color: #1e4a60; }

    /* ── Buttons */
    .btn-row {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface2);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.82em;
      font-weight: 600;
      font-family: var(--font);
      transition: background 0.15s, opacity 0.15s;
    }

    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover:not(:disabled) { background: #81d4fa; }

    .btn-secondary {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border-hi);
    }
    .btn-secondary:hover:not(:disabled) { background: var(--surface2); color: var(--text); }

    .btn-success {
      background: var(--green-dim);
      color: var(--green);
      border: 1px solid #2a4a2a;
    }
    .btn-success:hover:not(:disabled) { background: #223322; }

    /* ── Score Section */
    .score-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
    }

    .score-top {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 16px;
    }

    .score-ring-wrap {
      position: relative;
      width: 72px;
      height: 72px;
      flex-shrink: 0;
    }

    .score-ring-wrap svg { transform: rotate(-90deg); }

    .score-ring-bg { fill: none; stroke: var(--border-hi); stroke-width: 5; }

    .score-ring-fill {
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.4s;
    }

    .score-ring-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .score-number { font-size: 1.3em; font-weight: 700; }
    .score-denom { font-size: 0.6em; color: var(--text-mute); margin-top: 1px; }

    .score-info { flex: 1; }

    .score-title {
      font-size: 0.82em;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .score-bar-track {
      background: var(--border-hi);
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .score-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .score-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.7em;
      color: var(--text-mute);
    }

    /* ── Breakdown chips */
    .breakdown-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
    }

    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
    }

    .chip-name {
      font-size: 0.68em;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-mute);
      margin-bottom: 4px;
    }

    .chip-bar-track {
      background: var(--border-hi);
      border-radius: 3px;
      height: 4px;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .chip-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s ease;
    }

    .chip-val { font-size: 0.75em; font-weight: 600; }

    .chip.earned { border-color: #2a4a2a; }
    .chip.earned .chip-name { color: var(--green); }

    /* ── Feedback */
    .feedback-section { margin-top: 14px; }

    .feedback-title {
      font-size: 0.7em;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-mute);
      margin-bottom: 8px;
    }

    .feedback-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: var(--orange-dim);
      border: 1px solid #3a2a10;
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      margin-bottom: 6px;
      font-size: 0.85em;
      color: #ffcc80;
    }

    .feedback-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--orange);
      flex-shrink: 0;
      margin-top: 6px;
    }

    .no-feedback {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--green-dim);
      border: 1px solid #2a4a2a;
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 0.85em;
      color: #a5d6a7;
    }

    .check-icon {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 9px;
      color: #000;
      font-weight: 700;
    }

    /* ── Explanation */
    .explanation-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 0.88em;
      color: var(--text-dim);
      line-height: 1.7;
      margin-bottom: 14px;
    }

    /* ── Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #2a2a2a;
      color: var(--text);
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.82em;
      font-weight: 500;
      border-left: 3px solid var(--accent);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show { opacity: 1; transform: none; }
    .toast.success { border-left-color: var(--green); }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo"></div>
      <h1>Prompt Refiner</h1>
    </div>
    <div class="header-meta" id="timestamp"></div>
  </div>

  <!-- Refine Again bar (visible after first result) -->
  <div class="refine-bar" id="refine-bar">
    <input
      class="refine-input"
      id="refine-input"
      type="text"
      placeholder="Enter another prompt to refine..."
      onkeydown="if(event.key==='Enter') refineAgain()"
    />
    <button class="btn-refine" id="btn-refine-again" onclick="refineAgain()">Refine</button>
  </div>

  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Analyzing your prompt...</div>
  </div>

  <!-- Result (hidden until data arrives) -->
  <div id="result">

    <!-- Original Prompt -->
    <div class="card">
      <div class="card-header">
        <span class="card-label">Original Prompt</span>
        <span class="card-tag tag-original">Input</span>
      </div>
      <div class="card-body" id="original"></div>
    </div>

    <!-- Improved Prompt -->
    <div class="card improved">
      <div class="card-header">
        <span class="card-label">Refined Prompt</span>
        <span class="card-tag tag-improved">AI Optimized</span>
      </div>
      <div class="card-body mono" id="improved"></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btn-copy" onclick="copyPrompt()">
          Copy
        </button>
        <button class="btn btn-success" id="btn-replace" onclick="replaceSelection()">
          Replace Selection
        </button>
      </div>
    </div>

    <!-- Explanation -->
    <div class="explanation-card" id="explanation"></div>

    <!-- Score -->
    <div class="score-card">
      <div class="score-top">
        <div class="score-ring-wrap">
          <svg width="72" height="72" viewBox="0 0 72 72">
            <circle class="score-ring-bg" cx="36" cy="36" r="30"/>
            <circle class="score-ring-fill" id="ring-fill" cx="36" cy="36" r="30"
              stroke-dasharray="188.5"
              stroke-dashoffset="188.5"/>
          </svg>
          <div class="score-ring-text">
            <span class="score-number" id="score-number">-</span>
            <span class="score-denom">/100</span>
          </div>
        </div>

        <div class="score-info">
          <div class="score-title">Prompt Quality Score</div>
          <div class="score-bar-track">
            <div class="score-bar-fill" id="score-bar" style="width:0%"></div>
          </div>
          <div class="score-label-row">
            <span>Weak</span><span>Good</span><span>Excellent</span>
          </div>
        </div>
      </div>

      <!-- Breakdown chips -->
      <div class="breakdown-grid" id="breakdown"></div>

      <!-- Feedback / suggestions -->
      <div class="feedback-section" id="feedback-section"></div>
    </div>

  </div><!-- /result -->
</div><!-- /app -->

<div class="toast" id="toast"></div>

<script>
  const vscode = acquireVsCodeApi();
  let lastImproved = '';

  window.addEventListener('message', (event) => {
    const { original, improved, explanation, score, breakdown, feedback } = event.data;
    lastImproved = improved || '';

    // Populate cards
    document.getElementById('original').textContent = original || '';
    document.getElementById('improved').textContent = improved || '';
    document.getElementById('explanation').textContent = explanation || '';
    document.getElementById('timestamp').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    // Score color
    const color = score >= 85 ? 'var(--green)' : score >= 60 ? 'var(--orange)' : 'var(--red)';

    // Animate ring
    const circumference = 188.5;
    const offset = circumference - (score / 100) * circumference;
    const ring = document.getElementById('ring-fill');
    ring.style.stroke = color;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      ring.style.strokeDashoffset = offset;
    }));

    // Number + bar
    const numEl = document.getElementById('score-number');
    numEl.textContent = score;
    numEl.style.color = color;
    const bar = document.getElementById('score-bar');
    bar.style.background = color;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      bar.style.width = score + '%';
    }));

    // Breakdown chips
    const bdEl = document.getElementById('breakdown');
    bdEl.innerHTML = '';
    const maxPerDim = 20;
    if (breakdown && typeof breakdown === 'object') {
      Object.entries(breakdown).forEach(([key, val]) => {
        const v = Number(val);
        const earned = v > 0;
        const pct = (v / maxPerDim) * 100;
        const chipColor = earned ? 'var(--green)' : 'var(--border-hi)';
        bdEl.innerHTML += `
          <div class="chip ${earned ? 'earned' : ''}">
            <div class="chip-name">${key}</div>
            <div class="chip-bar-track">
              <div class="chip-bar-fill" style="width:${pct}%; background:${chipColor}"></div>
            </div>
            <div class="chip-val" style="color:${chipColor}">${v} / ${maxPerDim}</div>
          </div>`;
      });
    }

    // Feedback / suggestions
    const fbSection = document.getElementById('feedback-section');
    fbSection.innerHTML = '';
    if (feedback && feedback.length > 0) {
      fbSection.innerHTML = '<div class="feedback-title">Suggestions</div>';
      feedback.forEach(f => {
        fbSection.innerHTML += `
          <div class="feedback-item">
            <div class="feedback-dot"></div>
            <span>${f}</span>
          </div>`;
      });
    } else {
      fbSection.innerHTML = `
        <div class="no-feedback">
          <div class="check-icon">v</div>
          <span>Prompt structure looks solid across all dimensions.</span>
        </div>`;
    }

    // Show result, hide loading, show refine bar
    document.getElementById('loading').style.display = 'none';
    document.getElementById('result').style.display = 'block';
    const refineBar = document.getElementById('refine-bar');
    refineBar.classList.add('visible');
    document.getElementById('refine-input').value = '';
  });

  function copyPrompt() {
    vscode.postMessage({ command: 'copy', text: lastImproved });
    flashBtn('btn-copy', 'Copied');
    showToast('Copied to clipboard', 'success');
  }

  function replaceSelection() {
    vscode.postMessage({ command: 'replace', text: lastImproved });
    showToast('Replaced selection in editor', 'success');
  }

  function refineAgain() {
    const val = document.getElementById('refine-input').value.trim();
    if (!val) return;
    document.getElementById('result').style.display = 'none';
    document.getElementById('refine-bar').classList.remove('visible');
    document.getElementById('loading').style.display = 'flex';
    vscode.postMessage({ command: 'refine', text: val });
  }

  function flashBtn(id, label) {
    const btn = document.getElementById(id);
    const orig = btn.textContent.trim();
    btn.textContent = label;
    btn.disabled = true;
    setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1800);
  }

  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2400);
  }

  // Signal ready
  vscode.postMessage({ command: 'ready' });
</script>
</body>
</html>
